name: Scoreboard

# Monthly accessibility check of the sites in scoreboard/sites.json. Commits the
# results to scoreboard/results/ and the Docs workflow republishes the page.

on:
  # Monthly schedule is enabled at first publication.
  # schedule:
  #   - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:tokens
      - name: Audit every site
        run: node scripts/scoreboard.mjs > "$GITHUB_STEP_SUMMARY"
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoreboard/results
          git diff --cached --quiet && echo "No new results" && exit 0
          git commit -m "chore(scoreboard): results for $(date -u +%Y-%m-%d)"
          git push
