name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, build, unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - name: Report sizes
        run: |
          echo "core.min.css gzip: $(gzip -c dist/core.min.css | wc -c) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "afrigov.iife.js: $(wc -c < dist/afrigov.iife.js) bytes" >> "$GITHUB_STEP_SUMMARY"

  release-pending:
    name: Is package.json released?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Warn when the version on main has no tag yet
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if git tag --list "$PKG" | grep -q .; then
            echo "$PKG is tagged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Release pending::package.json is at $PKG but there is no $PKG tag. Run the Release workflow when main is ready to ship."
            echo "**Release pending:** $PKG is on main but not tagged. Actions → Release → Run workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

  a11y:
    name: axe-core and touch targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
