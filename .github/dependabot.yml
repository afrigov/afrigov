version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        # Minor and patch only. A major bump folded into a grouped PR looks
        # routine and is not: stylelint 18 arrived this way and broke CI on
        # Node 20. Majors now come as their own pull request, where the
        # version jump is visible.
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # upload-pages-artifact v5 + deploy-pages v5 cannot find each other's
      # artifact ("No artifacts named github-pages"). v3 + v4 deploy fine.
      - dependency-name: actions/upload-pages-artifact
        update-types: ["version-update:semver-major"]
      - dependency-name: actions/deploy-pages
        update-types: ["version-update:semver-major"]
